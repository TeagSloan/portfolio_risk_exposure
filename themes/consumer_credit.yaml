# Consumer credit theme: hand-validated baseline (same method as the AI Exposure Screen).
# No observable "consumer credit price" -> checked by group consistency, no ground truth.
# Approved by Shannon 2026-11-12.

name: Consumer credit
plain_name: consumer borrowing and credit conditions
description: How much a holding moves with consumer lenders and the credit cycle.
baseline_source: manual

categories:
  - name: High
    direction: positive
    plain: "Strongly tied to consumer borrowing (credit card and consumer lenders)"
    members:
      - {ticker: SYF, evidence_pct: 96, evidence_type: "interest & fees on consumer loans / total interest income (FY2025)", note: "$21.7B of $22.6B"}
      - {ticker: COF, evidence_pct: 80, evidence_type: "(credit card + auto loans) / loans held for investment (Q4 2025)", note: "$279.6B + $83.6B of $453.6B"}
  - name: Inverse
    direction: inverse
    plain: "Tends to do better when consumer credit gets worse (buys defaulted debt)"
    members:
      - {ticker: PRAA, evidence_pct: 100, evidence_type: "pure-play buyer of nonperforming loans", note: "supply rises with charge-offs"}

control:
  - {ticker: ADBE, note: "Zero-exposure control: software, no consumer lending"}

direct_classification:
  - {ticker: ALLY, tier: High,     evidence_type: "core business is consumer auto lending", note: "$43.7B auto originations 2025; share of loans not found"}
  - {ticker: KMX,  tier: Moderate, evidence_type: "CarMax Auto Finance funds a large share of sales", note: "not disclosed as %"}
