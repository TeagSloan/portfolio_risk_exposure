[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Any warning counts as a test failure.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Standard error checks plus import order, common bug patterns and modern syntax.
select = ["E", "F", "W", "I", "B", "UP"]
