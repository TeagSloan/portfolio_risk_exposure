name: Oil live
enabled: false   # automatic FMP version (later step); hand-built baseline is oil.yaml
plain_name: oil prices
description: How much a holding moves with oil prices.
baseline_source: fmp_rules        # rebuild: python build_baseline.py oil
ground_truth: {ticker: USO, sign: 1, plain: "oil prices"}
max_per_tier: 4
min_market_cap: 5.0e+9

tiers:
  High:
    direction: positive
    plain: "Tends to rise and fall with oil prices"
    candidates:
      screen: {sector: Energy}
      tickers: [EOG, COP, OXY, DVN, FANG, APA]
    industry_contains: ["exploration", "e&p"]
  Moderate:
    direction: positive
    plain: "Partly tied to oil prices (integrated oil majors, oil services and drilling)"
    candidates:
      screen: {sector: Energy}
      tickers: [XOM, CVX, SLB, HAL, BKR]
    # Integrated majors (XOM, CVX) produce oil but refining/chemicals dampen the link -> Moderate
    industry_contains: ["integrated", "equipment", "services", "drilling"]
  Inverse:
    direction: inverse
    plain: "Tends to do worse when oil prices rise (fuel is a big cost)"
    candidates:
      screen: {sector: Industrials}
      tickers: [DAL, UAL, AAL, LUV]
    industry_contains: ["airlines"]
  Control:
    plain: "Reference company with no oil link"
    candidates:
      tickers: [ADBE, INTU, CRM, NOW]
    industry_contains: ["software"]
