name: China
plain_name: China's economy
description: How much a holding moves with companies that earn a large share of revenue in China.
enabled: false   # not one of the six hackathon themes; re-enable to use
baseline_source: fmp_rules        # rebuild: python build_baseline.py china
ground_truth: {ticker: FXI, sign: 1, plain: "Chinese stocks"}   # iShares China Large-Cap ETF
max_per_tier: 4

# Many companies lump China into "Asia Pacific" or "International". Then the China share is
# HIDDEN, so the company is excluded with that reason instead of being counted as 0%.
_china: &china
  match: ["china", "hong kong", "macau", "macao", "prc"]
  ambiguous: ["asia", "pacific", "apac", "international", "rest of world", "foreign", "other countries", "non-u"]

tiers:
  High:
    direction: positive
    plain: "Earns a large share of its revenue in China (25% or more)"
    candidates:
      tickers: &cands [QCOM, AAPL, TSLA, NVDA, AMAT, LRCX, KLAC, TXN, MU, LVS, WYNN, YUMC, SBUX, NKE, EL, INTC, AVGO, BA]
    require:
      - {metric: segment_share, kind: geographic, min: 0.25, <<: *china}
  Moderate:
    direction: positive
    plain: "Earns a meaningful share of its revenue in China (10-25%)"
    candidates:
      tickers: *cands
    require:
      - {metric: segment_share, kind: geographic, min: 0.10, <<: *china}
  Control:
    plain: "Reference company with verified 0% China revenue"
    candidates:
      tickers: [DUK, SO, AEP, WM, CMG]
    require:
      - {metric: segment_share, kind: geographic, max: 0.0, <<: *china}
