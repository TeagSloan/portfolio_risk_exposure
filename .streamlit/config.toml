# Look of the dashboard, from the team's "Shared look" sheet. The rest of the styling is in engine/ui_style.py.
[theme]
base = "dark"
primaryColor = "#8B7CF6"                # the one accent (purple)
backgroundColor = "#0E0F14"
secondaryBackgroundColor = "#171922"    # cards, sidebar, input fields
textColor = "#F2F3F7"
# Loaded from Google Fonts. With no internet the app falls back to system fonts and still works.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"

[client]
toolbarMode = "minimal"
