name: AI live
enabled: false   # automatic FMP version (later step); hand-built baseline is ai.yaml
plain_name: artificial intelligence (AI)
description: How much a holding moves with companies whose revenue comes from AI.
baseline_source: fmp_rules        # rebuild: python build_baseline.py ai
# No observable "AI price" exists, so there is no ground truth. Instead each reference
# must move with the rest of its group beyond the market (group consistency check).
max_per_tier: 4

tiers:
  High:
    direction: positive
    plain: "Strongly tied to AI. A large share of the business sells AI chips or infrastructure"
    candidates:
      tickers: [NVDA, AMD, MRVL, ANET, SMCI, VRT, MU]
    require:
      # Product segments reported in the 10-K: data-center / AI lines must be >= 40% of revenue
      - {metric: segment_share, kind: product, match: ["data center", "datacenter", "compute & networking", "ai "], min: 0.40}
  Moderate:
    direction: positive
    plain: "Partly tied to AI through cloud and data-center revenue"
    candidates:
      tickers: [MSFT, GOOGL, AMZN, ORCL, TSM]
    require:
      # Cloud / high-performance-computing lines as an AI proxy: >= 15% of revenue
      - {metric: segment_share, kind: product, match: ["cloud", "aws", "hpc", "high performance computing"], min: 0.15}
  Inverse:
    direction: inverse
    plain: "Tends to be hurt by AI (customers switching to AI tools)"
  Control:
    plain: "Reference company with no AI link"
    candidates:
      tickers: [ADM]

# Disclosures that the rules can't read from segment data. Labeled "manual" in the audit trail.
manual_members:
  - {ticker: AVGO, tier: High, evidence_pct: 49, evidence_type: "disclosed AI revenue share", note: "AI semiconductor revenue ~49% (10-K / earnings disclosure)"}
  - {ticker: CHGG, tier: Inverse, evidence_pct: -66, evidence_type: "disclosed revenue decline", note: "revenue decline attributed to generative AI substitution"}
