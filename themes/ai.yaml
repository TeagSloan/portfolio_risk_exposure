# AI theme: hand-validated baseline from Shannon's AI Exposure Screen (reference table, Nov 2026).
# Tier 1 = disclosed figure -> regression reference. Tier 2 / third-party -> classified directly.
# Pooled groups match the screen: High = NVDA+AVGO+MU+VRT, Moderate = TSM+MSFT+VST.

name: AI
plain_name: artificial intelligence (AI)
description: How much a holding moves with companies whose filings disclose AI exposure.
baseline_source: manual

categories:
  - name: High
    direction: positive
    plain: "Strongly tied to AI (sells AI chips or AI infrastructure)"
    members:
      - {ticker: NVDA, evidence_pct: 89.6, evidence_type: "revenue-disclosed", note: "Data Center share of revenue"}
      - {ticker: AVGO, evidence_pct: 49,   evidence_type: "revenue-disclosed", note: "AI semiconductor revenue"}
      - {ticker: MU,   evidence_pct: 55.5, evidence_type: "revenue-disclosed", note: "AI-related memory revenue"}
      - {ticker: VRT,  evidence_pct: 50,   evidence_type: "revenue-disclosed", note: "data center power & cooling"}
  - name: Moderate
    direction: positive
    plain: "Partly tied to AI"
    members:
      - {ticker: TSM,  evidence_pct: 18,  evidence_type: "strict AI-specific estimate", note: "AI accelerator foundry revenue"}
      - {ticker: MSFT, evidence_pct: 11.2, evidence_type: "annualized revenue run-rate", note: "disclosed AI run-rate"}
      - {ticker: VST,  evidence_pct: 8.6, evidence_type: "capacity-based proxy", note: "data center power contracts; flagged Limited on its own"}
  - name: Inverse
    direction: inverse
    plain: "Tends to be hurt by AI (customers switching to AI tools)"
    members:
      - {ticker: CHGG, evidence_pct: -66, evidence_type: "disruption case; not negative AI revenue", note: "revenue decline attributed to generative AI"}

control:
  - {ticker: ADM, note: "Project zero-exposure control"}

direct_classification:
  - {ticker: CRWV,  tier: High,     evidence_type: "pure-play AI cloud infrastructure (100%)", note: "short price history, not in regression"}
  - {ticker: GOOGL, tier: High,     evidence_type: "third-party product-line analysis", note: "not disclosed"}
  - {ticker: JPM,   tier: Moderate, evidence_type: "operational / qualitative", note: "not disclosed"}
  - {ticker: UPS,   tier: Moderate, evidence_type: "operational / qualitative; provisional", note: "not disclosed"}
  - {ticker: META,  tier: Moderate, evidence_type: "infrastructure and strategic; no revenue attribution", note: "not disclosed"}
  - {ticker: TSLA,  tier: Moderate, evidence_type: "infrastructure and strategic", note: "not disclosed"}
